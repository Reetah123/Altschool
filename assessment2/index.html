<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=" User registration form with JavaScript input validation"
    />
    <title>Registration Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="container">
      <form id="registrationForm">
        <h1>User Registration Form</h1>

        <!-- FULL NAME -->

        <div class="input-control">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" />
          <div id="nameError"></div>
        </div>

        <!-- EMAIL -->

        <div class="input-control">
          <label for="email">Email Address</label>
          <input type="text" id="email" name="email" />
          <div id="emailError"></div>
        </div>

        <!-- PASSWORD -->

        <div class="input-control">
          <label for="password">Password</label>
          <input type="password" id="password" />
          <div id="passwordError"></div>
        </div>

        <!-- CONFIRM PASSWORD -->

        <div class="input-control">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" />
          <div id="confirmPasswordError"></div>
        </div>

        <!-- AGE -->

        <div class="input-control">
          <label for="age">Age</label>
          <input type="number" id="age" />
          <div id="ageError"></div>
        </div>
       
        <!-- BUTTON FOR SUBMISSION -->

        <button type="submit">Register</button>
      </form>
    </div>

    <p id="successMessage"></p>
  </body>
</html>
