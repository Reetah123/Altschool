<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A beginner-friendly student grade tracker built with HTML, CSS, and JavaScript."
    />
    <title>Student Grade Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <div class="container">
        <h1>Student Grade Tracker</h1>
      </div>
    </header>

    <main>
      <!-- Add Student Form -->

      <section class="card">
        <h2>Add Student</h2>

        <form id="studentForm">
          <div class="field">
            <label for="studentName">Student Name</label>
            <input
              type="text"
              id="studentName"
              placeholder="e.g. Rita Ogar"
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="studentGrade">Grade (0 – 100)</label>
            <input type="number" id="studentGrade" />
          </div>
          <button type="submit">Add Student</button>
        </form>

        <p id="errorMessage" class="error-msg"></p>
      </section>

      <!-- Student List -->
      <section class="card">
        <h2>Student List</h2>

        <p id="emptyNote" class="empty-note">No students added yet.</p>

        <table id="studentTable" class="student-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Grade</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </section>

      <!-- Average -->
      <section class="card average-card">
        <span class="avg-label">Average Grade</span>
        <span id="averageGrade" class="avg-value">—</span>
      </section>
    </main>
  </body>
</html>
