<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A beginner-friendly student grade tracker built with HTML, CSS, and JavaScript."
    />
    <title>Weather Forecast App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>


  <body>
  <header>
    <h1>Weather App</h1>

    <form id="searchForm">
      <input type="text" id="cityInput" placeholder="Enter city name" />
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <p id="loadingMessage"></p>
    <p id="errorMessage"></p>

    <section>
      <h2>Current Weather</h2>
      <p id="weatherIcon"></p>
      <p id="cityName"></p>
      <p id="temperature"></p>
      <p id="description"></p>
    </section>

    <section>
      <h2>Weather Stats</h2>
      <p id="humidity"></p>
      <p id="windSpeed"></p>
      <p id="uvIndex">UV Index: Not available</p>
    </section>

    <section>
      <h2>5-Day Forecast</h2>
      <div id="forecastContainer"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
