<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>

    <header>
      <span aria-hidden="true">⎕</span>
      <h1>Weather App</h1>
    </header>

    <div class="search-row" role="search">
      <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" aria-label="City name" />
      <button id="searchButton" type="button">Search</button>
    </div>

    <p id="loadingMessage" role="status" aria-live="polite"></p>
    <p id="errorMessage"   role="alert"  aria-live="assertive"></p>

    <section class="hero" id="hero" aria-label="Current weather">
      <figure id="weatherIcon" aria-hidden="true"></figure>
      <h2 id="cityName"></h2>
      <p class="temperature" id="temperature"></p>
      <p class="condition"   id="description"></p>
    </section>

    <section class="stats" id="statsRow" aria-label="Weather statistics">
      <dl>
        <dt>Humidity</dt>
        <dd id="humidity">—</dd>
      </dl>
      <dl>
        <dt>Wind</dt>
        <dd id="windSpeed">—</dd>
      </dl>
      <dl>
        <dt>UV Index</dt>
        <dd id="uvIndex">—</dd>
      </dl>
    </section>

    <section class="forecast" id="forecastSection" aria-label="5-day forecast">
      <h3>5-Day Forecast</h3>
      <ul id="forecastContainer"></ul>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
